schema_version = 1
# Local runtime support accepts per-node ProviderRequest values for `codex` or
# `claude`; this planning asset intentionally stores neither CLI credentials nor
# provider command options.
runtime = "local"

[model_discovery]
mode = "automatic"
release_channel = "ga"
refresh = "run_start"
on_failure = "fail"

[tree]
max_depth = 3
max_children_per_node = 3
max_total_nodes = 9
max_parallel = 3
max_replans = 1

[budget]
root_reserve_percent = 35
retry_limit = 1

[efficiency]
# Fixed tokens one delegated invocation costs before doing any work. Measure it
# for your provider and leaf mode (lean leaves cost far less than full agents).
agent_overhead_tokens = 50000
# Split only when the smallest leaf's work is at least this multiple of overhead.
min_work_to_overhead_ratio = 3.0
# Split regardless when one agent would otherwise hold more work than this.
single_agent_context_tokens = 150000

[routing]
strategy = "weighted_complexity_size"
complexity_weight = 0.6
size_weight = 0.4
worker_max_score = 0.33
expert_max_score = 0.66

[models.lead]
model = "auto"
reasoning_effort = "high"

[models.expert]
model = "auto"
reasoning_effort = "high"

[models.worker]
model = "auto"
reasoning_effort = "medium"

[models.reviewer]
model = "auto"
reasoning_effort = "high"
