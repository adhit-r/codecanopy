name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate and stage public site
        run: |
          python3 -c "import json; from pathlib import Path; json.loads(Path('docs/index.html').read_text(encoding='utf-8').split('<script type=\"application/ld+json\">', 1)[1].split('</script>', 1)[0]); assert 'https://adhit-r.github.io/codecanopy/' in Path('docs/index.html').read_text(encoding='utf-8')"
          mkdir -p _site
          cp docs/index.html docs/styles.css docs/llms.txt docs/robots.txt docs/sitemap.xml docs/favicon.svg docs/codecanopy-social.png _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
